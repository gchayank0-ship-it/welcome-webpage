
apiVersion: apps/v1
kind: Deployment
metadata:
  name: welcome-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: welcome
  template:
    metadata:
      labels:
        app: welcome
    spec:
      containers:
      - name: welcome-container
        image: welcome-webpage:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
