
<!DOCTYPE html>
<html>
<head>
    <title>Welcome Webpage</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:100px;">

    <h1>Welcome to My Webpage!</h1>
    <h2 id="date"></h2>

    <script>
        let today = new Date();
        document.getElementById("date").innerHTML =
            "Current Date: " + today.toDateString();
    </script>

</body>
</html>
